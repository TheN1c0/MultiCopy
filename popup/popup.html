<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiCopy - Excel Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1>MultiCopy</h1>
          <span class="brand-subtitle">Excel Form Autofill</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-manage-profiles" class="icon-btn" title="Gestionar perfiles">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- VIEW 1: MAIN VIEW -->
    <main id="view-main" class="view active">
      <!-- Selector de Perfil Activo -->
      <section class="section-card">
        <label class="section-label" for="select-profile">Perfil de Formulario</label>
        <div class="profile-select-wrapper">
          <select id="select-profile" class="form-control select-control">
            <!-- Rellenado dinámicamente -->
          </select>
          <button id="btn-config-current-profile" class="btn-secondary btn-sm btn-pill" title="Configurar campos del perfil">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Configurar
          </button>
        </div>
      </section>

      <!-- Estado de Portapapeles -->
      <section class="section-card clipboard-card">
        <div class="card-header-row">
          <div class="status-indicator-group">
            <span id="clipboard-status-dot" class="status-dot dot-gray"></span>
            <span id="clipboard-status-text" class="status-text">Leyendo portapapeles...</span>
          </div>
          <button id="btn-refresh-clipboard" class="btn-ghost btn-sm btn-pill" title="Releer portapapeles">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
            Actualizar
          </button>
        </div>

        <div id="clipboard-warning" class="alert-box alert-warning hidden">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <span><strong>Varias filas copiadas:</strong> Se utilizará la 1ª fila.</span>
        </div>

        <div id="clipboard-empty-hint" class="hint-box">
          <p>Copia una fila en Excel (<strong>Ctrl + C</strong>) para rellenar automáticamente.</p>
          <button id="btn-paste-clipboard" class="btn-secondary btn-sm btn-pill" style="margin: 8px auto 0; display: flex;" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
            Pegar Portapapeles
          </button>
        </div>

        <!-- Vista Previa de Mapeo -->
        <div id="preview-container" class="preview-box hidden">
          <div class="preview-header">
            <span class="preview-title">Vista previa de datos</span>
            <span id="preview-col-count" class="badge">0 columnas</span>
          </div>
          <div id="preview-list" class="preview-list">
            <!-- Rellenado dinámicamente -->
          </div>
        </div>
      </section>

      <!-- Botón Principal Rellenar -->
      <section class="actions-container">
        <button id="btn-fill-form" class="btn-primary btn-block btn-lg btn-pill" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          RELLENAR FORMULARIO
        </button>
        <div id="fill-feedback" class="feedback-msg"></div>
      </section>
    </main>

    <!-- VIEW 2: PROFILES MANAGEMENT VIEW -->
    <main id="view-profiles" class="view">
      <div class="view-header">
        <button id="btn-back-from-profiles" class="btn-ghost btn-sm btn-pill">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
          Volver
        </button>
        <h2>Perfiles</h2>
      </div>

      <div class="create-profile-card">
        <label class="section-label">Crear nuevo perfil</label>
        <div class="input-action-group">
          <input type="text" id="input-new-profile-name" class="form-control" placeholder="Ej: Formulario Trabajadores">
          <button id="btn-create-profile" class="btn-primary btn-pill">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Crear
          </button>
        </div>
      </div>

      <div class="profiles-list-section">
        <label class="section-label">Perfiles existentes</label>
        <div id="profiles-list" class="items-list">
          <!-- Rellenado dinámicamente -->
        </div>
      </div>
    </main>

    <!-- VIEW 3: FIELD CONFIGURATION VIEW -->
    <main id="view-fields" class="view">
      <div class="view-header">
        <button id="btn-back-from-fields" class="btn-ghost btn-sm btn-pill">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
          Volver
        </button>
        <h2 id="fields-view-title">Campos del Perfil</h2>
      </div>

      <!-- Configuración de Dominio Opcional -->
      <div class="domain-binding-card">
        <label class="section-label" for="input-profile-domain">Dominio / URL asociada (opcional)</label>
        <div class="input-action-group">
          <input type="text" id="input-profile-domain" class="form-control" placeholder="Ej: empresa.cl o mi-sitio.com">
          <button id="btn-save-domain" class="btn-secondary btn-sm btn-pill">Guardar</button>
        </div>
      </div>

      <!-- Formulario para agregar / editar campo -->
      <div class="field-editor-card">
        <h3 id="field-form-title">Agregar nuevo campo</h3>
        <input type="hidden" id="edit-field-id" value="">
        
        <div class="form-group">
          <label class="field-label" for="input-field-name">Nombre / Etiqueta del campo</label>
          <input type="text" id="input-field-name" class="form-control" placeholder="Ej: RUT, Nombre, Correo...">
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="field-label" for="input-column-index">Columna Excel (1, 2...)</label>
            <input type="number" id="input-column-index" class="form-control" min="1" max="100" value="1">
          </div>
          <div class="form-group">
            <label class="field-label">Vincular elemento web</label>
            <button id="btn-start-pick-element" class="btn-accent btn-block btn-pill" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>
              Seleccionar
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label" for="input-field-selector">Selector CSS generado</label>
          <input type="text" id="input-field-selector" class="form-control form-control-sm" placeholder="Autogenerado al seleccionar en web">
        </div>

        <div class="card-footer-buttons">
          <button id="btn-cancel-edit-field" class="btn-ghost btn-sm btn-pill hidden" type="button">Cancelar</button>
          <button id="btn-save-field" class="btn-primary btn-sm btn-pill" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Guardar Campo
          </button>
        </div>
      </div>

      <!-- Lista de Campos Configurados -->
      <div class="fields-list-section">
        <div class="section-title-row">
          <label class="section-label">Campos configurados</label>
          <span id="fields-count-badge" class="badge">0 campos</span>
        </div>
        <div id="fields-list" class="items-list">
          <!-- Rellenado dinámicamente -->
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>MultiCopy • <strong>BravoBytes Edition</strong></span>
    </footer>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="../utils/clipboard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
